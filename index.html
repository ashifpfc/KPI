<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFC Engineer KPI Tracker</title>
<style>
:root{--navy:#1F3864;--blue:#2F5597;--bg:#F4F6FA;--card:#fff;--ink:#1d2433;--mute:#6b7385;--line:#e3e7ef;
  --good:#1E8E3E;--goodbg:#E6F4EA;--mid:#B26A00;--midbg:#FFF4E0;--low:#C5221F;--lowbg:#FCE8E6;--in:#FFF8E1}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
.hidden{display:none!important}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:600}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.red{background:var(--low)}
.btn.sm{padding:6px 10px;font-size:13px}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border-radius:14px;padding:24px;width:100%;max-width:380px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.box h1{margin:0 0 4px;font-size:20px;color:var(--navy)}
.box p{margin:0 0 12px;color:var(--mute);font-size:13px}
.err{color:var(--low);font-size:13px;min-height:18px;margin-top:8px}
header{background:#00162A;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:15px}
header .t span{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
header select{width:auto;padding:6px;background:#fff}
header .lo{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:6px 10px;font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:4}
.banner-logo{display:block;width:100%;border-radius:10px;margin:0 0 16px}
header .mark{height:36px;width:auto;flex:none;border-radius:4px}
nav button{border:0;background:var(--bg);padding:8px 12px;border-radius:20px;white-space:nowrap;font-size:14px;color:var(--ink)}
nav button.on{background:var(--navy);color:#fff}
.banner{background:var(--midbg);color:var(--mid);padding:10px 16px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
main{padding:16px;max-width:1000px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h2{margin:0 0 10px;font-size:16px;color:var(--navy)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13px}
.hero{display:flex;gap:18px;align-items:center}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;font-weight:700}
.sec{margin:8px 0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
.good{color:var(--good)}.mid{color:var(--mid)}.low{color:var(--low)}
.bgood{background:var(--good)}.bmid{background:#E8A33D}.blow{background:var(--low)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.pgood{background:var(--goodbg);color:var(--good)}.pmid{background:var(--midbg);color:var(--mid)}.plow{background:var(--lowbg);color:var(--low)}.pnone{background:var(--bg);color:var(--mute)}
.kpi{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.kpi:first-of-type{border-top:0}
.kpi .ref{font-weight:700;color:var(--blue);width:30px;flex:none}
.kpi .nums{text-align:right;flex:none;font-size:13px}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.seg button{border:0;background:#fff;padding:8px 16px;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on[data-v=Yes]{background:var(--good);color:#fff}
.seg button.on[data-v=No]{background:var(--low);color:#fff}
.seg button.on[data-v="N/A"]{background:var(--mute);color:#fff}
.num{width:100px;margin-top:6px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 0;text-align:center;font-size:13px}
.day small{display:block;font-size:10px;color:var(--mute)}
.day.fri{background:#f1f1f1}
.day.Yes{background:var(--good);color:#fff;border-color:var(--good)}
.day.No{background:var(--low);color:#fff;border-color:var(--low)}
.day.Yes small,.day.No small{color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--bg);font-size:12px;color:var(--mute);position:sticky;top:0}
.tw{overflow-x:auto}
tr.click{cursor:pointer}tr.click:hover{background:var(--bg)}
.list .li{padding:12px 0;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px}
@media(min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:16px}}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:10px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:.3s;z-index:30;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:grid;place-items:center;z-index:25}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.ro .edit{display:none!important}
.ro input,.ro select,.ro textarea,.ro .seg button,.ro .day{pointer-events:none}
@media print{header,nav,.edit,.banner{display:none!important}body{background:#fff}.card{border:0}}
</style>
</head>

if (typeof google === 'undefined' || !google.script || !google.script.run) {
  window.google = {script: {run: (function () {
    function Runner(ok, fail) { this._ok = ok; this._fail = fail; }
    Runner.prototype.withSuccessHandler = function (f) { return new Runner(f, this._fail); };
    Runner.prototype.withFailureHandler = function (f) { return new Runner(this._ok, f); };
    function send(r, fn, args) {
      var fail = function (msg) { var e = new Error(msg); if (r._fail) r._fail(e); else console.error(e); };
      if (!API_URL || API_URL.indexOf('PASTE_') === 0) return fail('App is not configured: API_URL is missing.');
      fetch(API_URL, {method: 'POST', redirect: 'follow',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({fn: fn, args: args})})
        .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
        .then(function (d) { if (r._ok) r._ok(d); })
        .catch(function () { fail('Cannot reach the server. Check your internet connection and try again.'); });
    }
    Runner.prototype.login = function () { send(this, 'login', [].slice.call(arguments)); };

<script>
var S = {token:null, user:null, cfg:null, year:new Date().getFullYear(), tab:'dash',
         viewEmp:null, viewName:'', month:new Date().getMonth()+1, q:Math.floor(new Date().getMonth()/3)+1};
var MEM = {};

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pct(p){return p==null||p===''?'–':Math.round(p*100)+'%'}
function cls(p){return p==null?'none':p>=0.9?'good':p>=0.5?'mid':'low'}
function pill(p){return '<span class="pill p'+cls(p)+'">'+pct(p)+'</span>'}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},2600)}
function busy(on){$('busy').classList.toggle('hidden',!on)}
function store(k,v){try{if(v==null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){MEM[k]=v}}
function load(k){try{return sessionStorage.getItem(k)}catch(e){return MEM[k]||null}}
function isMgr(){return S.user&&(S.user.role==='Manager'||S.user.role==='Admin')}
function isAdmin(){return S.user&&S.user.role==='Admin'}
function ro(){return !!S.viewEmp}

function call(action,p){
  busy(true);
  return new Promise(function(res,rej){
    google.script.run.withSuccessHandler(function(r){
      busy(false);
      if(r&&r.ok) return res(r.data);
      var e=r?r.error:'Error';
      if(e==='SESSION_EXPIRED'){logout(true);return rej(new Error('Session expired, please login again.'))}
      if(e==='PASSWORD_CHANGE_REQUIRED'){showPw(true);return rej(new Error('Please change your password first.'))}
      rej(new Error(e));
    }).withFailureHandler(function(err){busy(false);rej(err)}).api(S.token,action,p||{});
  });
}
function fail(e){toast(e&&e.message?e.message:String(e))}

/* ---------- login ---------- */
function doLogin(){
  var id=$('lId').value.trim(), pw=$('lPw').value;
  if(!id||!pw){$('lErr').textContent='Enter Employee ID and password.';return}
  $('lErr').textContent='';busy(true);
  google.script.run.withSuccessHandler(function(r){
    busy(false);
    if(!r.ok){$('lErr').textContent=r.error;return}
    S.token=r.data.token;S.user=r.data.user;S.cfg=r.data.config;store('kpiToken',S.token);
    $('lPw').value='';
    if(S.user.mustChange) showPw(true); else showApp();
  }).withFailureHandler(function(e){busy(false);$('lErr').textContent=e.message}).login(id,pw);
}
$('lPw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});

function showPw(forced){
  $('loginScr').classList.add('hidden');$('app').classList.add('hidden');$('pwScr').classList.remove('hidden');
  $('pCancel').classList.toggle('hidden',!!forced);
  $('pwMsg').textContent=forced?'Please set a new password before you continue.':'Change your password.';
  ['pOld','pNew','pNew2'].forEach(function(i){$(i).value=''});$('pErr').textContent='';
}
function doChangePw(){
  var o=$('pOld').value,n=$('pNew').value,n2=$('pNew2').value;
  if(n!==n2){$('pErr').textContent='New passwords do not match.';return}
  call('changePassword',{oldPass:o,newPass:n}).then(function(){
    S.user.mustChange=false;toast('Password changed');showApp();
  }).catch(function(e){$('pErr').textContent=e.message});
}
function logout(silent){
  if(S.token&&!silent) google.script.run.api(S.token,'logout',{});
  S.token=null;S.user=null;S.viewEmp=null;store('kpiToken',null);closeModal();
  $('app').classList.add('hidden');$('pwScr').classList.add('hidden');$('loginScr').classList.remove('hidden');
  if(silent) $('lErr').textContent='Session expired. Please login again.';
}

  $('hName').textContent=S.user.name;
  $('hSub').textContent=S.user.empId+' · '+(S.user.designation||S.user.role);
  var y=new Date().getFullYear(),h='';
  for(var i=y-2;i<=y+1;i++) h+='<option'+(i===S.year?' selected':'')+'>'+i+'</option>';

function tabsList(){
  var t=[['dash','Dashboard'],['monthly','Monthly'],['quarterly','Quarterly'],['dpr','DPR'],['projects','Projects'],['activity','Activities']];
  if(!ro()&&isMgr()) t.push(['team','Team']);
  if(!ro()&&isAdmin()) t.push(['users','Users']);
  return t;
}
function render(){
  var t=tabsList();
  if(!t.some(function(x){return x[0]===S.tab})) S.tab='dash';
  $('tabs').innerHTML=t.map(function(x){return '<button class="'+(x[0]===S.tab?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');
  var b=$('banner');
  if(ro()){b.classList.remove('hidden');b.innerHTML='<span>👁 Viewing <b>'+esc(S.viewName)+'</b> ('+esc(S.viewEmp)+') — read only</span><button class="btn sm sec" onclick="backToMe()">← Back</button>'}
  else b.classList.add('hidden');
  $('main').className=ro()?'ro':'';
  $('main').innerHTML='<div class="card mute">Loading…</div>';
  var f={dash:tabDash,monthly:tabMonthly,quarterly:tabQuarterly,dpr:tabDpr,projects:tabProjects,activity:tabActivity,team:tabTeam,users:tabUsers}[S.tab];
  f().catch(function(e){$('main').innerHTML='<div class="card low">'+esc(e.message)+'</div>'});

function go(t){S.tab=t;render();window.scrollTo(0,0)}
function viewEng(id,name){S.viewEmp=id;S.viewName=name;S.tab='dash';render()}

    '<button class="btn sec" style="width:100%;margin:6px 0" onclick="closeModal();showPw(false)">🔑 Change password</button>'+

function dayTap(i){var c=DPR[i-1]||'';DPR[i-1]=c===''?'Yes':c==='Yes'?'No':'';paintDay(i)}

      '<p class="mute">A temporary password is shown when you add a user. Send it to the engineer by SMS or WhatsApp. They will set their own password at first login.</p></div>';
    h+='<div class="card tw"><table><thead><tr><th>Emp ID</th><th>Name</th><th>Role</th><th>Active</th><th></th></tr></thead><tbody>'+
      list.map(function(u){return '<tr><td>'+esc(u.empId)+'</td><td>'+esc(u.name)+'<div class="mute">'+esc(u.designation)+'</div></td><td>'+esc(u.role)+'</td><td>'+(u.active==='Yes'?'✅':'⛔')+'</td>'+
        '<td style="white-space:nowrap"><button class="btn sm sec" onclick="editUser(\''+esc(u.empId)+'\')">Edit</button> <button class="btn sm sec" onclick="resetPw(\''+esc(u.empId)+'\')">Reset PW</button></td></tr>'}).join('')+
      '</tbody></table></div>';
    $('main').innerHTML=h;
  });
}
function editUser(id){
  var u=id?LAST.users.filter(function(x){return x.empId===id})[0]:{role:'Engineer',active:'Yes'};
  openModal('<h2 style="margin-top:0">'+(id?'Edit user':'New user')+'</h2>'+
    '<label>Employee ID *</label><input id="uI" value="'+esc(u.empId)+'"'+(id?' disabled':'')+'>'+
    '<label>Name *</label><input id="uN" value="'+esc(u.name)+'">'+
    '<label>Designation</label><input id="uD" value="'+esc(u.designation)+'">'+
    '<div class="row"><div class="grow"><label>Role</label><select id="uR">'+['Engineer','Manager','Admin'].map(function(o){return '<option'+(o===u.role?' selected':'')+'>'+o+'</option>'}).join('')+'</select></div>'+
    '<div class="grow"><label>Active</label><select id="uA">'+['Yes','No'].map(function(o){return '<option'+(o===u.active?' selected':'')+'>'+o+'</option>'}).join('')+'</select></div></div>'+
    '<p class="mute">Engineer = own KPI only · Manager = can also view the team · Admin = can also manage users</p>'+
    '<div class="row" style="margin-top:14px"><button class="btn grow" onclick="saveUser()">Save</button><button class="btn sec" onclick="closeModal()">Cancel</button></div>');
}
function saveUser(){
  call('saveUser',{user:{empId:$('uI').value,name:$('uN').value,designation:$('uD').value,role:$('uR').value,active:$('uA').value}}).then(function(r){
    if(r.tempPass) showTemp(r); else {closeModal();toast('Saved')}
    render();
  }).catch(fail);
}
function resetPw(id){if(!confirm('Reset password for '+id+'?'))return;call('resetPassword',{empId:id}).then(showTemp).catch(fail)}
function showTemp(r){
  openModal('<h2 style="margin-top:0">Login details</h2><p>Send these details to the engineer:</p>'+
    '<div class="card" style="font-size:16px">Employee ID: <b>'+esc(r.empId)+'</b><br>Temporary password: <b style="letter-spacing:1px">'+esc(r.tempPass)+'</b></div>'+
    '<p class="mute">This password will not be shown again. The engineer must set a new password at first login.</p>'+
    '<button class="btn" style="width:100%" onclick="closeModal()">Done</button>');
}

/* ---------- start ---------- */
(function(){
  var t=load('kpiToken');if(!t)return;
  S.token=t;
  call('me',{}).then(function(d){S.user=d.user;S.cfg=d.config;if(S.user.mustChange)showPw(true);else showApp()})
    .catch(function(){S.token=null;store('kpiToken',null);$('lErr').textContent=''});
})();
</script>
</body>
</html>
